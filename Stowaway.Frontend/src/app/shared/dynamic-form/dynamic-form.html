<div class="dynamic-form-wrapper">
  <form (ngSubmit)="onSubmit()" [formGroup]="form()" class="dynamic-form" [class.has-images]="imagesQuestion()">
    <div class="dynamic-form-fields">
      @for (question of fieldQuestions(); track question) {
        <div class="form-row">
          <app-dynamic-form-question [question]="question" [form]="form()" />
        </div>
      }
    </div>
    @if (imagesQuestion(); as question) {
      <div class="dynamic-form-images">
        <app-dynamic-form-question [question]="question" [form]="form()" />
      </div>
    }
    <div class="form-row form-actions">
      <button mat-button type="button" (click)="onCancel()">Cancel</button>
      <button mat-flat-button color="primary" type="submit" [disabled]="!form().valid">Save</button>
    </div>

  </form>
  <!-- @if (payLoad) {
    <div class="form-row payload"><strong>Saved the following values</strong><br />{{ payLoad }}</div>
  } -->
</div>
