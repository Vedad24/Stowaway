<div class="dynamic-form">
  <form (ngSubmit)="onSubmit()" [formGroup]="form()">
    @for (question of questions(); track question) {
      <div class="form-row">
        <app-dynamic-form-question [question]="question" [form]="form()" />
      </div>
    }
    <div class="form-row form-actions">
      <button mat-raised-button color="primary" type="submit" [disabled]="!form().valid">Save</button>
    </div>
  </form>
  @if (payLoad) {
    <div class="form-row payload"><strong>Saved the following values</strong><br />{{ payLoad }}</div>
  }
</div>
