<div class="dialog-card">
  <div class="dialog-header">
    <span class="dialog-icon" [class.dialog-icon-danger]="data.danger">
      <mat-icon>{{ data.danger ? 'warning' : 'help_outline' }}</mat-icon>
    </span>
    <div>
      <h2>{{ data.title }}</h2>
      <p class="subtitle">{{ data.message }}</p>
    </div>
  </div>

  <div class="actions">
    <button mat-button type="button" (click)="dialogRef.close(false)">{{ data.cancelLabel ?? 'Cancel' }}</button>
    <button
      mat-flat-button
      [color]="data.danger ? 'warn' : 'primary'"
      type="button"
      (click)="dialogRef.close(true)"
    >
      {{ data.confirmLabel ?? 'Delete' }}
    </button>
  </div>
</div>
