<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="space-y-6 max-w-xl bg-white p-6 rounded-lg shadow"
>

  <!-- Name -->
  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium text-gray-700">Name</label>

    <input
      type="text"
      formControlName="name"
      class="rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
    />

    @if (form.get('name')?.touched && form.get('name')?.invalid) {
      <span class="text-xs text-red-600">
        Name is required
      </span>
    }
  </div>

  <!-- Description -->
  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium text-gray-700">Description</label>

    <textarea
      formControlName="description"
      rows="3"
      class="rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
    ></textarea>
  </div>

  <div class="flex flex-col gap-1">
  <label class="text-sm font-medium text-gray-700">Quantity</label>

  <input
    type="number"
    formControlName="totalDeliveries"
    min="0"
    class="rounded-md border border-gray-300 px-3 py-2 text-sm
           focus:outline-none focus:ring-2 focus:ring-blue-500"
  />

  <input
    type="number"
    formControlName="failedDeliveries"
    min="0"
    class="rounded-md border border-gray-300 px-3 py-2 text-sm
           focus:outline-none focus:ring-2 focus:ring-blue-500"
  />

  @if (form.get('quantity')?.touched && form.get('quantity')?.invalid) {
    <span class="text-xs text-red-600">
      Quantity must be at least 1
    </span>
  }
</div>






  <!-- Submit -->
  <div class="pt-4">
    <button
      type="submit"
      class="w-full rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white
             hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
      [disabled]="form.invalid"
    >
      Add Item
    </button>
  </div>

</form>
