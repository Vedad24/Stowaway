<div class="supplier-page">
  <header class="app-header">
    <div class="logoName">
      <button mat-icon-button type="button" matTooltip="Back to modules" routerLink="/main">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <img class="logo" src="assets/icons/dolly.png" alt="" />
      <h1 class="app-title">Stowaway</h1>
    </div>
    <div class="header-actions">
      <app-theme-toggle></app-theme-toggle>
      <button mat-flat-button color="primary" type="button" (click)="routeToAdd()">
        <mat-icon>add</mat-icon>
        Add supplier
      </button>
    </div>
  </header>

  <main class="supplier-content">
    <div class="supplier-sheet">
      <header class="supplier-header">
        <div>
          <h1>Suppliers</h1>
          <p class="supplier-subtitle">{{ totalItems() }} supplier{{ totalItems() === 1 ? '' : 's' }}</p>
        </div>
      </header>

      <div class="supplier-toolbar">
        <div class="supplier-search">
          <mat-form-field subscriptSizing="dynamic">
            <mat-label>Search</mat-label>
            <input matInput [(ngModel)]="searchTerm" (keyup.enter)="searchData()" />
            <mat-icon matSuffix>search</mat-icon>
          </mat-form-field>
          <button mat-stroked-button type="button" (click)="searchData()">Search</button>
        </div>
      </div>

      @if (isLoading) {
        <p class="supplier-state">Loading…</p>
      } @else if (totalItems() === 0) {
        <p class="supplier-state">No suppliers found.</p>
      } @else {
        <div class="supplier-table-wrap">
          <app-pagination-table
            [columns]="columnDef"
            [items]="items()"
            [totalItems]="totalItems()"
            [pageIndex]="paging.page - 1"
            [pageSize]="paging.pageSize"
            (page)="onPage($event)"
          ></app-pagination-table>
        </div>
      }
    </div>
  </main>
</div>
