<div class="edit-supplier-page">
  <header class="app-header">
    <div class="logoName">
      <button mat-icon-button type="button" matTooltip="Back to suppliers" routerLink="/supplier">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <img class="logo" src="assets/icons/dolly.png" alt="" />
      <h1 class="app-title">Stowaway</h1>
    </div>
  </header>

  <main class="edit-supplier-content">
    <div class="edit-supplier-sheet">
      <header class="edit-supplier-header">
        <h1>Edit supplier</h1>
        <p class="edit-supplier-subtitle">Update the supplier's details below.</p>
      </header>

      @if (isLoading) {
        <p class="supplier-state">Loading…</p>
      } @else {
        <form [formGroup]="editForm" (ngSubmit)="save()" class="supplier-form">
          <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" />
            @if (editForm.get('name')?.touched && editForm.get('name')?.invalid) {
              <mat-error>Name is required</mat-error>
            }
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Description</mat-label>
            <textarea matInput formControlName="description" rows="3"></textarea>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Address</mat-label>
            <input matInput formControlName="address" />
          </mat-form-field>

          <div class="supplier-form-row">
            <mat-form-field appearance="outline">
              <mat-label>Total deliveries</mat-label>
              <input matInput type="number" formControlName="totalDeliveries" min="0" />
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>Failed deliveries</mat-label>
              <input matInput type="number" formControlName="failedDeliveries" min="0" />
            </mat-form-field>
          </div>

          <div class="supplier-form-actions">
            <button mat-stroked-button type="button" routerLink="/supplier">Cancel</button>
            <button mat-flat-button color="primary" type="submit" [disabled]="editForm.invalid">
              <mat-icon>save</mat-icon>
              Save changes
            </button>
          </div>
        </form>
      }
    </div>
  </main>
</div>
