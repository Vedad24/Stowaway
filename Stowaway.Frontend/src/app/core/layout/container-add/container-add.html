<div class="dialog-card">
  <h2>Create container</h2>
  <p>Add a new container to this location.</p>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Name</mat-label>
    <input matInput [(ngModel)]="name" name="name" required />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Type</mat-label>
    <mat-select [(ngModel)]="containerTypeId" name="containerTypeId" required [disabled]="isLoadingTypes()">
      @for (type of containerTypes(); track type.id) {
        <mat-option [value]="type.id">{{ type.displayName }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  <div class="actions">
    <button mat-button type="button" (click)="dialogRef.close(false)">Cancel</button>
    <button
      mat-flat-button
      color="primary"
      type="button"
      [disabled]="isSubmitting() || !name.trim() || containerTypeId == null"
      (click)="submit()"
    >
      {{ isSubmitting() ? 'Creating...' : 'Create' }}
    </button>
  </div>
</div>
