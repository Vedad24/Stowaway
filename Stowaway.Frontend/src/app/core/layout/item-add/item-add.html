<div class="dialog-card">
  <h2>Create item</h2>
  <p>Add a new item and choose which container it belongs in.</p>

  <app-dynamic-form [fields]="fields()" [(formValue)]="formValue" />

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  <div class="actions">
    <button mat-button type="button" (click)="dialogRef.close(false)">Cancel</button>
    <button
      mat-flat-button
      color="primary"
      type="button"
      [disabled]="isSubmitting() || !isValid()"
      (click)="submit()"
    >
      {{ isSubmitting() ? 'Creating...' : 'Create' }}
    </button>
  </div>
</div>
