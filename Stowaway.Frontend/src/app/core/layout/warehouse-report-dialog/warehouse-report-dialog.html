<div class="dialog-card">
  <h2>Generate report</h2>
  <p>Choose what to include in the report for "{{ data.warehouseName }}".</p>

  <mat-radio-group [ngModel]="reportType()" (ngModelChange)="reportType.set($event)" class="type-group">
    <mat-radio-button value="containers">Containers only</mat-radio-button>
    <mat-radio-button value="items">Items only</mat-radio-button>
    <mat-radio-button value="both">Containers and items</mat-radio-button>
  </mat-radio-group>

  <div class="actions">
    <button mat-button type="button" (click)="dialogRef.close()">Cancel</button>
    <button mat-flat-button type="button" (click)="generate()">Generate</button>
  </div>
</div>
