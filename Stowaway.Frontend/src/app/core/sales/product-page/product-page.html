<section class="product-page-card">
  <div class="product-page-image" aria-label="Product image placeholder">
    <div class="product-image-placeholder"></div>
  </div>

  <div class="product-page-details">
    <h2>Product page</h2>
    <p>Select a warehouse, choose a container type, and add the desired quantity to your cart.</p>

    <form class="product-page-form" [formGroup]="productForm" (ngSubmit)="addToCart()">
      <app-autocomplete-component
        formControlName="warehouse"
        [options]="warehouses()"
        [optionInfo]="{ displayName: 'name' }"
      ></app-autocomplete-component>

      <div class="container-type-group">
        <span class="field-label">Container type</span>

        <div class="container-type-list">
          @for (containerType of containerTypes(); track containerType.id) {
            <button
              type="button"
              mat-stroked-button
              class="container-type-card"
              [class.selected]="productForm.get('containerType')?.value === containerType.id"
              (click)="productForm.patchValue({ containerType: containerType.id })"
            >
              <span class="container-type-name">{{ containerType.displayName }}</span>
              <span class="container-type-price">{{ containerType.price | currency }}</span>
            </button>
          }
        </div>
      </div>

      <mat-form-field appearance="outline">
        <mat-label>Quantity</mat-label>
        <input matInput type="number" min="1" formControlName="quantity" />
      </mat-form-field>

      <button mat-flat-button color="primary" type="submit" class="add-to-cart-button" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Adding...' : 'Add to cart' }}
      </button>
    </form>

  @if (message) {
    <p class="message">{{ message }}</p>
  }

  <div class="w-full flex justify-center mt-4">
    <button matButton (click) = "goToCart()">Cart</button>

  </div>
</section>
