<section class="product-page-card">
  <div class="product-page-image" aria-label="Product image placeholder">
    <div class="product-image-placeholder"></div>
  </div>

  <div class="product-page-details">
    <h2>Product page</h2>
    <p>Select a warehouse, choose a container type, and add the desired quantity to your cart.</p>

    <form class="product-page-form" (ngSubmit)="addToCart()">
      <label>
        Warehouse
        <select [(ngModel)]="selectedWarehouseId" name="warehouse">
          <option [ngValue]="null" disabled>Select warehouse</option>
          @for (warehouse of warehouses(); track warehouse.id) {
            <option [ngValue]="warehouse.id">
              {{ warehouse.name }}
            </option>
          }
        </select>
      </label>

      <div class="container-type-group">
        <span class="field-label">Container type</span>

        <div class="container-type-list">
          @for (containerType of containerTypes(); track containerType.id) {
            <button
              type="button"
              class="container-type-card"
              [class.selected]="selectedContainerTypeId === containerType.id"
              (click)="selectedContainerTypeId = containerType.id"
            >
              <span class="container-type-name">{{ containerType.displayName }}</span>
              <span class="container-type-price">{{ containerType.price | currency }}</span>
            </button>
          }
        </div>
      </div>

      <label>
        Quantity
        <input type="number" min="1" [(ngModel)]="quantity" name="quantity" />
      </label>

      <button type="submit" class="add-to-cart-button" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Adding...' : 'Add to cart' }}
      </button>
    </form>

    @if (message) {
      <p class="message">{{ message }}</p>
    }
  </div>
</section>
