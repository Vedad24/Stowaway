<p class="text-center">Order test</p>
<div class = "flex flex-col h-lvh justify-around">
    <form [formGroup]="orderForm" class="flex flex-col">
        <mat-form-field>
            <mat-label>Order ID</mat-label>
            <input matInput [formControl]="orderForm.controls.orderId">
        </mat-form-field>
        <mat-form-field>
            <mat-label>User ID</mat-label>
            <input matInput [formControl]="orderForm.controls.userId">
        </mat-form-field>
        
        <div [formArray]="orderForm.controls.items">
            @for(item of orderForm.controls.items.controls; track $index){
                <div [formGroupName]="$index" class="flex flex-row justify-around items-center">
                    <mat-form-field>
                        <label>ContainerTypeId</label>
                        <input matInput formControlName="containerTypeId" type="number" min="1">
                    </mat-form-field>
                    <mat-form-field>
                        <label>Quantity</label>
                        <input matInput formControlName="quantity" type="number" min="1">
                    </mat-form-field>
                    <button matButton="filled" (click)="removeOrderItemForm($index)">Remove item</button>
                </div>
            }
        </div>
        <button matButton="outlined" (click)="addOrderItemForm()">Add item</button>
    </form>
    <div class="flex flex-row justify-around p-3">
        <button matButton="outlined" (click)="createOrder()">Create order</button>
        <button matButton="outlined" (click)="updateOrder()">Update order</button>
        <button matButton="outlined" (click)="deleteOrder()">Delete order</button>
    </div>
    <div>
        <app-list-sales #listSales></app-list-sales>
    </div>
</div>
