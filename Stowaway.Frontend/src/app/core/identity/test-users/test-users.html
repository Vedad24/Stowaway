<form [formGroup]="userForm" class="flex flex-col ">
    <mat-form-field>
        <mat-label>Id</mat-label>
        <input matInput type="number" [formControl]="userForm.controls.id" placeholder="Enter id">
    </mat-form-field>
    <mat-form-field >
        <mat-label>Email</mat-label>
        <input matInput [formControl]="userForm.controls.email" placeholder="Enter email">
    </mat-form-field>
    <mat-form-field> 
        <mat-label>Password</mat-label>
        <input matInput [formControl]="userForm.controls.password" placeholder="Enter password">
    </mat-form-field>
    <mat-form-field>
        <mat-label>First Name</mat-label>
        <input matInput [formControl]="userForm.controls.firstName" placeholder="Enter first name">
    </mat-form-field>
    <mat-form-field>
        <mat-label>Last Name</mat-label>
        <input matInput [formControl]="userForm.controls.lastName" placeholder="Enter last name">
    </mat-form-field>
    <app-autocomplete-component 
        formControlName="role"
        [options]="roles" 
        [optionInfo]="this.rolesDisplayInfo">
    </app-autocomplete-component>
    <mat-checkbox formControlName="isEnabled">Enabled</mat-checkbox>
    
</form>
<button mat-raised-button color="primary" (click)="createUser()">Create User</button>
<button mat-raised-button color="accent" (click)="updateUser()">Update User</button>
<button mat-raised-button color="warn" (click)="deleteUser()">Delete User</button>



<app-list-users #listUsersTable></app-list-users>
