<form class="flex flex-col gap-2">
    <mat-form-field subscriptSizing="dynamic">
        <mat-label>Warehouse</mat-label>
        <input matInput type="text" [value]="warehouseName()" disabled>
    </mat-form-field>
    <mat-form-field subscriptSizing="dynamic">
        <mat-label>User</mat-label>
        <input matInput type="text" [value]="userName()" disabled>
    </mat-form-field>
    <app-autocomplete-component
        [formControl]="priviledgeGroupControl"
        [options]="priviledgeGroups()"
        [optionInfo]="priviledgeGroupInfo">
    </app-autocomplete-component>
</form>
<div mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">Cancel</button>
    <button mat-raised-button color="primary" [disabled]="!priviledgeGroupControl.value" (click)="save()">Save</button>
</div>
