<div class="max-w-2xl mx-auto p-6 bg-white rounded-xl shadow space-y-6">

  <h2 class="text-xl font-bold text-gray-800">Edit Item</h2>

  <form [formGroup]="editForm" (ngSubmit)="save()" class="space-y-4">

    <!-- Name -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Name</label>
      <input
        type="text"
        formControlName="name"
        class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2
               focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-500"
      />
    </div>

    <!-- Description -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Description</label>
      <textarea
        formControlName="description"
        rows="3"
        class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2
               focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-500"
      ></textarea>
    </div>

    <!-- City -->
    <div>
      <label class="block text-sm font-medium text-gray-700">City</label>
      <input
        type="text"
        formControlName="city"
        class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2
               focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-500"
      />
    </div>

    <!-- Address -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Address</label>
      <input
        type="text"
        formControlName="address"
        class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2
               focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-500"
      />
    </div>

    <!-- Capacity -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Capacity</label>
      <input
        type="number"
        formControlName="capacity"
        class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2
               focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-500"
      />
    </div>

    <!-- Enabled -->
    <div class="flex items-center space-x-2">
      <input
        type="checkbox"
        formControlName="isEnabled"
        class="h-4 w-4 accent-blue-600"
      />
      <label class="text-gray-700 text-sm font-medium">Enabled</label>
    </div>

    <!-- Submit -->
    <button
      type="submit"
      class="w-full bg-blue-600 text-white font-medium py-2 px-4 rounded-lg
             hover:bg-blue-700 transition"
      [disabled]="editForm.invalid"
    >
      Save Changes
    </button>

  </form>
</div>
